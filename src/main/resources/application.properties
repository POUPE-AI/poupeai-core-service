# Server Configuration
server.port=8085

# Custom App Security Configuration
app.security.internal-api-key=${INTERNAL_API_KEY:chave-secreta}
app.security.internal-header-name=x-api-key

# Application Name
spring.application.name=poupeai-core-service

# Datasource Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:core_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Security / OAuth2 Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URL}

# Keycloak Admin Client Configuration
keycloak.admin.server-url=${KEYCLOAK_SERVER_URL}
keycloak.admin.realm=${KEYCLOAK_REALM:poupe-ai}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}
keycloak.admin.username=${KEYCLOAK_ADMIN_USER}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD}

# MinIO Configuration
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket-name=${MINIO_BUCKET:poupeai-receipts}

# File Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:poupeai}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:senha}

# RabbitMQ Ingestion Jobs Configuration
app.rabbitmq.ingestionjobs.exchange=${RABBITMQ_INGESTION_EXCHANGE:ingestion_jobs_exchange}
app.rabbitmq.ingestionjobs.queue=${RABBITMQ_INGESTION_QUEUE:ingestion_jobs}
app.rabbitmq.ingestionjobs.routing-key=${RABBITMQ_INGESTION_ROUTING_KEY:ingestion.job}

# RabbitMQ Notifications Configuration
app.rabbitmq.notifications.exchange=${RABBITMQ_NOTIFICATIONS_EXCHANGE:notifications_main_exchange}
app.rabbitmq.notifications.queue=${RABBITMQ_NOTIFICATIONS_QUEUE:notifications_events}
app.rabbitmq.notifications.routing-key=${RABBITMQ_NOTIFICATIONS_ROUTING_KEY:notifications.events}

# Invoice Notification Scheduler Configuration
app.scheduler.invoice.due-soon-days=${INVOICE_DUE_SOON_DAYS:5}
app.scheduler.invoice.due-soon-cron=${INVOICE_DUE_SOON_CRON:0 0 9 * * *}
app.scheduler.invoice.overdue-cron=${INVOICE_OVERDUE_CRON:0 5 9 * * *}

# Profile Deletion Scheduler Configuration
app.scheduler.profile.deletion-cron=${PROFILE_DELETION_CRON:0 59 23 * * *}

